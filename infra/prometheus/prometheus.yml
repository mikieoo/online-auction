global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auction-platform'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auction-service:8081
          - bid-service:8082
          - payment-service:8083
          - gateway:8080
          - discovery-service:8761
