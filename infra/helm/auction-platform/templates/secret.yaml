apiVersion: v1
kind: Secret
metadata:
  name: auction-platform-secret
  labels:
    {{- include "auction-platform.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-password: {{ required "secrets.mysqlPassword를 --set-string으로 주입해야 합니다" .Values.secrets.mysqlPassword | b64enc | quote }}
  jwt-secret: {{ required "secrets.jwtSecret을 --set-string으로 주입해야 합니다 (32바이트 이상)" .Values.secrets.jwtSecret | b64enc | quote }}
