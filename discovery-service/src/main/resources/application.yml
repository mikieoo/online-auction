server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  instance:
    hostname: localhost
  client:
    # 서버 자신은 등록하지도, 레지스트리를 가져오지도 않는다(단일 인스턴스).
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka
  server:
    # 로컬 개발용: 서비스를 죽였을 때 죽은 인스턴스가 레지스트리에 오래 남지 않게 한다.
    # self-preservation은 "갱신이 갑자기 줄면 네트워크 문제로 보고 만료를 멈추는" 보호 장치인데,
    # 서비스를 수시로 껐다 켜는 로컬에서는 죽은 인스턴스를 붙잡아 두는 원인이 된다. 운영에서는 켜 두는 것이 기본.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    # 응답 캐시 갱신 주기(기본 30초)를 줄여 등록·해제가 조회에 빨리 반영되게 한다.
    response-cache-update-interval-ms: 5000
