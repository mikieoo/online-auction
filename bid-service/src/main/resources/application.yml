server:
  port: 8082

spring:
  application:
    name: bid-service
  datasource:
    url: jdbc:mysql://localhost:3306/bid_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

bid:
  # 입찰 증가 단위(원). 후속 입찰은 현재 최고가 + 이 값을 초과해야 한다.
  increment: 1000

clients:
  auction-service:
    url: http://localhost:8081
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
