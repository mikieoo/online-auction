spring:
  datasource:
    url: jdbc:mysql://auction-mysql:3306/bid_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
  data:
    redis:
      host: auction-redis
  kafka:
    bootstrap-servers: auction-kafka:29092

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka

management:
  zipkin:
    tracing:
      endpoint: http://auction-zipkin:9411/api/v2/spans
